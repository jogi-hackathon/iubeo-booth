<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IUBEO 伝票メーカー</title>
    <link rel="icon" href="/iubeo_logo.svg" />
  </head>
  <body>
    <main class="layout">
      <section class="form" aria-labelledby="title">
        <header class="head">
          <h1 id="title">伝票メーカー</h1>
          <p class="lead">ゲームの依頼伝票と同じ見た目で、中身を書き換えて刷る。</p>
        </header>

        <fieldset class="group">
          <legend>紙の大きさ</legend>
          <div class="seg">
            <button type="button" data-paper="a7" aria-pressed="true">A7</button>
            <button type="button" data-paper="t02" aria-pressed="false">T02 実寸（幅 48 mm）</button>
          </div>
          <p class="note">
            Phomemo T02 のロール紙は幅 53 mm。A7（74 mm 幅）はアプリが紙の幅に合わせて縮めて刷る。縮めずに刷るなら「T02 実寸」。
          </p>
        </fieldset>

        <fieldset class="group">
          <legend>伝票</legend>
          <div class="row">
            <label for="number">伝票番号</label>
            <div class="with-button">
              <input id="number" type="text" maxlength="12" autocomplete="off" />
              <button type="button" id="renumber" class="ghost">作り直す</button>
            </div>
          </div>
          <div class="row two">
            <div>
              <label for="phase">フェーズ</label>
              <input id="phase" type="number" min="0" max="99" inputmode="numeric" />
            </div>
            <div>
              <label for="limit">制限（秒）</label>
              <input id="limit" type="number" min="0" inputmode="numeric" placeholder="空なら --" />
            </div>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>タスク（最大 6 件）</legend>
          <ol id="items" class="items"></ol>
          <button type="button" id="addItem" class="ghost">タスクを足す</button>
        </fieldset>

        <div class="actions">
          <button type="button" id="savePng" class="primary">PNG を保存</button>
          <button type="button" id="savePdf">PDF を保存</button>
        </div>
        <p class="note">
          スマホなら PNG を写真に保存して、Phomemo アプリの画像の印刷から刷るのが手軽。印刷が薄いときは、アプリで濃度を上げる。
        </p>
      </section>

      <section class="preview" aria-label="プレビュー">
        <canvas id="preview" aria-label="伝票のプレビュー"></canvas>
        <p class="note" id="sizeNote"></p>
      </section>
    </main>
    <script type="module" src="/src/slip/main.ts"></script>
  </body>
</html>
