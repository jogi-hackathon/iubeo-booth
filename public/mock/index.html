<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- claude.ai の Artifact (IUBEO ブース模型) と同じ中身。Artifact 側が付ける最低限のリセットだけ足している -->
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>IUBEO ブース模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* レイアウト: 画面いっぱいの白い模型、左上に図面の凡例のような操作盤を一枚だけ浮かべる */
  :root {
    --paper: #f3f3f0;
    --sheet: #fbfbf9;
    --ink: #1b1b1a;
    --sub: #77776f;
    --rule: #d9d9d3;
    --warn: #a2401c;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  /* IUBEO の中には色がない。模型も白い世界のまま、どのテーマでも同じ見た目にする。 */
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    width: 296px;
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    background: color-mix(in srgb, var(--sheet) 92%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
  }
  .head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--ink);
  }
  .head h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; }
  .head .scale { font-family: var(--mono); font-size: 11px; color: var(--sub); }
  .toggle-panel { display: none; }

  .body { display: flex; flex-direction: column; }
  section { padding: 12px 16px 14px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
  section:last-child { border-bottom: 0; }
  h2 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; color: var(--sub); }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--ink); }
  .seg button {
    font: 500 12px/1 var(--sans); padding: 8px 4px; background: transparent; color: var(--ink);
    border: 0; border-left: 1px solid var(--ink); cursor: pointer;
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
  .seg button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; }
  .field label { font-size: 12px; }
  .field output { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .field input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }

  .text-input {
    font: 500 14px/1.4 var(--sans); padding: 7px 9px; border: 1px solid var(--ink);
    background: var(--sheet); color: var(--ink); width: 100%; border-radius: 0;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px/1 var(--sans); padding: 6px 9px; border: 1px solid var(--rule); background: var(--sheet); color: var(--sub); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .chip.off[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12px; }
  dt { color: var(--sub); }
  dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .warn { margin: 0; font-size: 12px; color: var(--warn); line-height: 1.6; }
  .note { margin: 0; font-size: 11px; color: var(--sub); line-height: 1.7; }
  .items { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; }
  .items span:nth-child(even) { font-family: var(--mono); color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 720px) {
    .panel { top: auto; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 55%; }
    .toggle-panel {
      display: inline-block; font: 500 12px/1 var(--sans); background: transparent;
      border: 1px solid var(--ink); color: var(--ink); padding: 5px 8px; cursor: pointer;
    }
    .panel.collapsed .body { display: none; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="IUBEO の展示ブースの 3D 模型。ドラッグで回転、ホイールやピンチで拡大縮小できる"></canvas>

<aside class="panel" id="panel">
  <div class="head">
    <h1>IUBEO ブース模型</h1>
    <span class="scale">単位 mm</span>
    <button class="toggle-panel" id="togglePanel" type="button" aria-expanded="true">閉じる</button>
  </div>
  <div class="body">
    <section>
      <h2>視点</h2>
      <div class="seg" id="views">
        <button type="button" data-view="visitor" aria-pressed="true">来場者</button>
        <button type="button" data-view="table" aria-pressed="false">机の上</button>
        <button type="button" data-view="overview" aria-pressed="false">斜め上</button>
        <button type="button" data-view="top" aria-pressed="false">真上</button>
      </div>
    </section>

    <section>
      <h2>座り方</h2>
      <div class="seg" id="modes">
        <button type="button" data-mode="front-free" aria-pressed="true">通路側を空ける</button>
        <button type="button" data-mode="front-seat" aria-pressed="false">通路側にも座る</button>
      </div>
      <p class="note" id="modeNote"></p>
    </section>

    <section>
      <h2>六角形の机</h2>
      <div class="field">
        <label for="hexSide">1 辺</label><output id="hexSideOut"></output>
        <input type="range" id="hexSide" min="700" max="1300" step="10" value="1000">
      </div>
    </section>

    <section>
      <h2>白いクロス（円形）</h2>
      <div class="field">
        <label for="clothD">直径</label><output id="clothDOut"></output>
        <input type="range" id="clothD" min="2000" max="3200" step="50" value="2750">
      </div>
      <p class="note" id="clothNote"></p>
    </section>

    <section>
      <h2>iPad に映すもの</h2>
      <div class="field">
        <label>iPad Pro 11″</label>
      </div>
      <div class="seg" data-ipad="pro">
        <button type="button" data-show="observer" aria-pressed="true">観測</button>
        <button type="button" data-show="slides" aria-pressed="false">資料</button>
        <button type="button" data-show="video" aria-pressed="false">デモ動画</button>
        <button type="button" data-show="none" aria-pressed="false">置かない</button>
      </div>
      <div class="field">
        <label>iPad mini</label>
      </div>
      <div class="seg" data-ipad="mini">
        <button type="button" data-show="observer" aria-pressed="false">観測</button>
        <button type="button" data-show="slides" aria-pressed="false">資料</button>
        <button type="button" data-show="video" aria-pressed="true">デモ動画</button>
        <button type="button" data-show="none" aria-pressed="false">置かない</button>
      </div>
    </section>

    <section>
      <h2>ファイルの大きさ</h2>
      <div class="seg" id="fileSizes">
        <button type="button" data-size="palm" aria-pressed="true">手のひら</button>
        <button type="button" data-size="a4" aria-pressed="false">A4</button>
      </div>
      <p class="note">手のひらは、ゲームの中のファイルと同じ大きさ（名刺くらい）。来場者に持ち帰ってもらう想定。</p>
    </section>

    <section>
      <h2>お題の三角紙</h2>
      <label class="note" for="memoTopic">お題の語（チーム名など）</label>
      <input class="text-input" id="memoTopic" type="text" value="ゆーべお" maxlength="40" autocomplete="off">
    </section>

    <section>
      <h2>置くもの</h2>
      <div class="chips" id="items">
        <button type="button" class="chip" data-item="cloth" aria-pressed="true">白いクロス</button>
        <button type="button" class="chip" data-item="logo" aria-pressed="true">ロゴ（A3）</button>
        <button type="button" class="chip" data-item="files" aria-pressed="true">ファイル</button>
        <button type="button" class="chip" data-item="printer" aria-pressed="true">サーマルプリンタと伝票</button>
        <button type="button" class="chip" data-item="memo" aria-pressed="true">お題の三角紙</button>
        <button type="button" class="chip" data-item="chairs" aria-pressed="true">椅子</button>
        <button type="button" class="chip" data-item="people" aria-pressed="true">人</button>
      </div>
      <ul class="items" id="itemList"></ul>
    </section>

    <section>
      <h2>脱落した席（人と画面を消す）</h2>
      <div class="chips" id="drops">
        <button type="button" class="chip off" data-seat="0" aria-pressed="false">席 1</button>
        <button type="button" class="chip off" data-seat="1" aria-pressed="false">席 2</button>
        <button type="button" class="chip off" data-seat="2" aria-pressed="false">席 3</button>
      </div>
    </section>

    <section>
      <h2>寸法</h2>
      <dl id="stats"></dl>
      <p class="warn" id="warn" hidden></p>
    </section>
  </div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

// ---- 状態 -------------------------------------------------------------
const state = {
  // 正六角形の 1 辺 (m)。台形の机 2 台をつないで正六角形になる
  hexSide: 1.0,
  clothD: 2.75,
  // 六角形の辺に 1 つおきに 3 人が座り、中央を 120° ずつ囲む。IUBEO のサンドボックスと同じ形
  mode: "front-free",
  items: {cloth: true, logo: true, files: true, printer: true, memo: true, chairs: true, people: true},
  // ファイルの大きさ。palm: ゲームの中と同じ実物大 (名刺くらい) / a4: A4 に刷ったパネル
  fileSize: "palm",
  team: "ゆーべお",
  // 持ち込む iPad に何を映すか。observer: 観測 (前面カメラで来場者を骨格にする) / slides: 資料 / video: デモ動画 / none: 置かない
  ipads: {pro: "observer", mini: "video"},
  dropped: [false, false, false],
};

// 寸法 (m)。ロゴとパネルは入稿データ (iubeo-booth/print) の仕上がり寸法
const TOP = 0.7;             // 天板の高さ
const CLOTH_MARGIN = 0.03;   // 垂れたクロスの表面が、天板の縁から外へ出るぶん (ひだの厚み)
const CHAIR_GAP = 0.45;      // 机の縁から椅子の中心まで
const SEAT_ROOM = 0.8;       // 机の縁から、座った人の背中側に要る奥行
const SIZES = {
  laptop: [0.304, 0.215],    // MacBook 13″
  pro: [0.2497, 0.1775],     // iPad Pro 11″ (横向き)
  mini: [0.2, 0.14],         // iPad mini (持ち込む人の申告で約 200 × 140)
  logo: [0.39, 0.143],       // A3 に刷ったロゴを、余白 20 mm 付きで切ったカード
  search: [0.218, 0.178],    // A4 版のファイルのパネル
  image: [0.216, 0.176],
  write: [0.176, 0.216],
  memo: [0.2, 0.14],         // お題の三角紙 (ゲームの PC の横のメモと同じ 200 × 140)
};

// ---- レンダラーと場 ---------------------------------------------------
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f3f3f0");
scene.fog = new THREE.Fog("#f3f3f0", 8, 20);

const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 80);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.6;
controls.maxDistance = 12;

scene.add(new THREE.HemisphereLight("#ffffff", "#d8d8d2", 1.9));
const sun = new THREE.DirectionalLight("#ffffff", 1.4);
sun.position.set(2.5, 5.5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 16});
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);

const venue = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({color: "#e9e9e5"}));
venue.rotation.x = -Math.PI / 2;
venue.receiveShadow = true;
scene.add(venue);
const grid = new THREE.GridHelper(60, 120, "#d6d6d0", "#dfdfda");
grid.position.y = 0.001;
scene.add(grid);

// ---- 材質 ------------------------------------------------------------
const M = {
  white: new THREE.MeshLambertMaterial({color: "#fbfbf9"}),
  cloth: new THREE.MeshLambertMaterial({color: "#ffffff"}),
  wood: new THREE.MeshLambertMaterial({color: "#e6d3ab"}),
  dark: new THREE.MeshLambertMaterial({color: "#2a2a28"}),
  chair: new THREE.MeshLambertMaterial({color: "#3a3a38"}),
  grey: new THREE.MeshLambertMaterial({color: "#bdbdb6"}),
  leg: new THREE.MeshLambertMaterial({color: "#c4c6c8"}),
  outline: new THREE.MeshBasicMaterial({color: "#1a1a1a", side: THREE.BackSide}),
  edge: new THREE.LineBasicMaterial({color: "#1d1d1b", transparent: true, opacity: 0.5}),
  seam: new THREE.LineBasicMaterial({color: "#8a7a5c"}),
};

// ---- 画面やパネルに貼る絵 (canvas テクスチャ) -------------------------
const texCache = new Map();
const canvasTex = (key, w, h, draw) => {
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  texCache.set(key, t);
  return t;
};

const INK = "#1a1a1a";

// ゲームのプレイヤーと同じ、白い関節と黒い縁の棒人間
const drawFigure = (g, x, y, s) => {
  const P = {
    head: [0, -1.55], neck: [0, -1.35], ls: [-0.2, -1.35], rs: [0.2, -1.35],
    le: [-0.27, -1.05], re: [0.3, -1.08], lw: [-0.3, -0.78], rw: [0.42, -0.85],
    lh: [-0.12, -0.85], rh: [0.12, -0.85], lk: [-0.15, -0.45], rk: [0.16, -0.45],
    la: [-0.17, -0.05], ra: [0.2, -0.05],
  };
  const bones = [["head","neck"],["ls","rs"],["lh","rh"],["ls","lh"],["rs","rh"],["ls","le"],["le","lw"],["rs","re"],["re","rw"],["lh","lk"],["lk","la"],["rh","rk"],["rk","ra"]];
  const pt = (k) => [x + P[k][0] * s, y + P[k][1] * s];
  for (const [col, grow] of [[INK, 0.012], ["#ffffff", 0]]) {
    g.strokeStyle = col; g.fillStyle = col; g.lineCap = "round";
    g.lineWidth = (0.03 + grow * 2) * s;
    g.beginPath();
    for (const [a, b] of bones) { const [ax, ay] = pt(a); const [bx, by] = pt(b); g.moveTo(ax, ay); g.lineTo(bx, by); }
    g.stroke();
    for (const k of Object.keys(P)) {
      if (k === "neck") continue;
      const [px, py] = pt(k);
      g.beginPath();
      g.arc(px, py, (k === "head" ? 0.11 : 0.03) * s + grow * s, 0, Math.PI * 2);
      g.fill();
    }
  }
};

// IUBEO のロゴ (docs/assets/iubeo_logo.svg)。文字ごとに縦だけ半分に縮める変形と、それで縮む線幅も再現する
const LOGO_STROKE = 109.36;
const compose = (o, i) => [o[0] * i[0], o[3] * i[3], o[0] * i[4] + o[4], o[3] * i[5] + o[5]];
const LOGO_E = compose([1.001262, 0, 0, 1.001262, -0.781958, -2.523829], [0.962382, 0, 0, 0.481911, 179.648169, 1037.383312]);
const LOGO_B = compose([1.001262, 0, 0, 1.001262, -58.855149, -2.523829], [0.962382, 0, 0, 0.481911, -39.293751, 1037.383312]);
const LOGO = [
  [[0.963597, 0.482519, -251.15293, 1036.168572], [[492, 326], [492, 3669]]],
  [[0.963597, 0.482519, 267.261992, 1036.168572], [[492, 326], [492, 3669], [1347.009, 2813.991], [1347.009, 1616]]],
  [LOGO_B, [[2107, 326], [2107, 2785]]],
  [LOGO_B, [[2107, 326], [3000, 326], [2107, 1555.5], [3000, 1555.5], [2107, 3669]]],
  [LOGO_E, [[2326, 3669], [4005, 3669], [4005, 326], [3365, 326]]],
  [LOGO_E, [[4005, 1997.5], [3000, 2000]]],
  [[0.963597, -0.482519, 344.306327, 2963.831428], [[4311, 326], [4339, 3669], [5638, 3669], [4580, 769]]],
];
const LOGO_BOX = {x0: 170.5, y0: 1166.4, x1: 5830.0, y1: 2833.7};
const drawLogo = (g, cx, cy, width) => {
  const s = width / (LOGO_BOX.x1 - LOGO_BOX.x0);
  const ox = cx - ((LOGO_BOX.x0 + LOGO_BOX.x1) / 2) * s;
  const oy = cy - ((LOGO_BOX.y0 + LOGO_BOX.y1) / 2) * s;
  g.strokeStyle = "#0d0d0d"; g.lineCap = "square"; g.lineJoin = "round";
  for (const [[a, d, e, f], pts] of LOGO) {
    g.save();
    g.setTransform(s * a, 0, 0, s * d, ox + s * e, oy + s * f);
    g.lineWidth = LOGO_STROKE;
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.stroke();
    g.restore();
  }
};

const logoTex = () => canvasTex("logo-card", 1560, 572, (g, w, h) => {
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
  drawLogo(g, w / 2, h / 2, w * (350 / 390));
});

// ゲーム内ファイルの 2D 図 (frontend/src/items/fileModel)。白は見える所だけに敷く
const FILE_SPECS = {
  search: {w: 0.1, h: 0.08, outline: 0.0045},
  image: {w: 0.1, h: 0.08, outline: 0.004},
  write: {w: 0.08, h: 0.1, outline: 0.004},
};
const fileTex = (kind) => canvasTex(`file:${kind}`, 1024, 1024, (g, cw, ch) => {
  const spec = FILE_SPECS[kind];
  const fullW = spec.w + spec.outline * 2;
  const fullH = spec.h + spec.outline * 2;
  const k = Math.min(cw / fullW, ch / fullH);
  g.canvas.width = Math.round(fullW * k);
  g.canvas.height = Math.round(fullH * k);
  const X = (x) => (x + fullW / 2) * k;
  const Y = (y) => (fullH / 2 - y) * k;
  const rect = (cx, cy, w, h, color) => { g.fillStyle = color; g.fillRect(X(cx - w / 2), Y(cy + h / 2), w * k, h * k); };
  const circle = (cx, cy, r, color) => { g.fillStyle = color; g.beginPath(); g.arc(X(cx), Y(cy), r * k, 0, Math.PI * 2); g.fill(); };
  rect(0, 0, fullW, fullH, INK);
  if (kind === "search") {
    const titleH = 0.016, titleY = (spec.h - titleH) / 2, bodyH = spec.h - titleH;
    rect(0, -spec.h / 2 + bodyH / 2, spec.w, bodyH, "#ffffff");
    for (let i = 0; i < 3; i++) circle(-spec.w / 2 + 0.01 + i * 0.009, titleY, 0.0032, "#ffffff");
    const fw = 0.072, fh = 0.022, fy = 0.008, border = 0.003;
    rect(0, fy, fw, fh, INK);
    rect(0, fy, fw - border * 2, fh - border * 2, "#ffffff");
    const lx = fw / 2 - 0.014, ly = fy + 0.0015;
    circle(lx, ly, 0.0052, INK);
    circle(lx, ly, 0.003, "#ffffff");
    g.save(); g.translate(X(lx + 0.0042), Y(ly - 0.0042)); g.rotate(Math.PI / 4);
    g.fillStyle = INK; g.fillRect(-0.0025 * k, -0.0008 * k, 0.005 * k, 0.0016 * k); g.restore();
    rect(-0.004, -0.012, 0.064, 0.005, INK);
    rect(-0.01, -0.022, 0.052, 0.005, INK);
  }
  if (kind === "image") {
    const bar = 0.012, inner = spec.h - bar * 2;

    mountain(-0.014, 0.036, 0.03);
    mountain(0.021, 0.024, 0.02);
    circle(0.024, 0.012, 0.01, INK);
  }
  if (kind === "write") {
    rect(0, 0, spec.w, spec.h, "#ffffff");
    for (const [y, w] of [[0.03, 0.06], [0.015, 0.052], [0, 0.06], [-0.015, 0.044], [-0.03, 0.03]]) {
      rect(-0.03 + w / 2, y, w, 0.006, INK);
    }
  }
});

// 伝票。ゲームの依頼伝票 (frontend/src/game/slip/content.ts の paintSlip) を写す。紙は 58 × 120 mm
const SLIP = {w: 0.058, h: 0.12};
const SAMPLE_SLIP = {
  number: "3-TASK31",
  phase: 3,
  items: [["検索", "React Three Fiber"], ["読み込みと編集", "橙のファイル"], ["書き込み", null]],
  limitSeconds: 120,
};
const slipTex = () => canvasTex("slip", 320, Math.round((320 * SLIP.h) / SLIP.w), (ctx, w, h) => {
  const FONT = MEMO_FONT;
  const MONO = `"Menlo", "Courier New", ${FONT}`;
  const EDGE = 3, MARGIN = 26, TOOTH = {width: 12, height: 7};
  // 上下の端は千切った跡のギザギザ。外側は透明
  ctx.clearRect(0, 0, w, h);
  ctx.beginPath();
  ctx.moveTo(0, TOOTH.height);
  for (let x = 0; x < w; x += TOOTH.width) { ctx.lineTo(x + TOOTH.width / 2, 0); ctx.lineTo(Math.min(w, x + TOOTH.width), TOOTH.height); }
  ctx.lineTo(w, h - TOOTH.height);
  for (let x = w; x > 0; x -= TOOTH.width) { ctx.lineTo(x - TOOTH.width / 2, h); ctx.lineTo(Math.max(0, x - TOOTH.width), h - TOOTH.height); }
  ctx.closePath();
  ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.lineWidth = EDGE * 2; ctx.strokeStyle = INK;
  ctx.save(); ctx.clip(); ctx.stroke(); ctx.restore();
  const dashed = (y) => {
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.moveTo(MARGIN, y); ctx.lineTo(w - MARGIN, y); ctx.stroke(); ctx.restore();
  };
  const c = SAMPLE_SLIP;
  ctx.fillStyle = INK; ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
  ctx.font = `bold 40px ${FONT}`; ctx.fillText("依 頼", w / 2, 78);
  ctx.font = `14px ${MONO}`; ctx.fillText("* * *  ORDER SLIP  * * *", w / 2, 102);
  dashed(118);
  ctx.textAlign = "left"; ctx.font = `17px ${MONO}`; ctx.fillText(`No. ${c.number}`, MARGIN, 148);
  ctx.textAlign = "right"; ctx.fillText(`PHASE ${c.phase}`, w - MARGIN, 148);
  dashed(166);
  ctx.textAlign = "left"; ctx.font = `16px ${FONT}`; ctx.fillText(`タスク ${c.items.length} 件`, MARGIN, 196);
  const top = 212, bottom = h - 170;
  const slot = Math.min(40, (bottom - top) / Math.max(1, c.items.length));
  const lines = c.items.map(([kind, detail], i) => (detail === null ? `${i + 1}. ${kind}` : `${i + 1}. ${kind} / ${detail}`));
  let size = Math.round(slot * 0.6);
  for (const line of lines) {
    let s = Math.round(slot * 0.6);
    for (; s > 10; s -= 2) { ctx.font = `bold ${s}px ${FONT}`; if (ctx.measureText(line).width <= w - 2 * MARGIN) break; }
    size = Math.min(size, s);
  }
  ctx.font = `bold ${size}px ${FONT}`;
  lines.forEach((line, i) => ctx.fillText(line, MARGIN, top + slot * i + (slot + size) / 2 - 2));
  const y = bottom + 6;
  dashed(y);
  ctx.font = `17px ${MONO}`; ctx.fillText("制限", MARGIN, y + 30);
  ctx.textAlign = "right"; ctx.fillText(`${c.limitSeconds} 秒`, w - MARGIN, y + 30);
  // 伝票番号から決まるバーコード風の縞
  let seed = 7;
  for (const ch of c.number) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  let x = MARGIN;
  while (x < w - MARGIN) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    const bar = 2 + ((seed >>> 16) & 3);
    const gap = 2 + ((seed >>> 20) & 3);
    ctx.fillRect(x, h - 118, Math.min(bar, w - MARGIN - x), 44);
    x += bar + gap;
  }
  ctx.textAlign = "center"; ctx.font = `12px ${MONO}`; ctx.fillText("IUBEO", w / 2, h - 56);
});

// ゲーム本体と同じ比率の骨格。頭 0.11m、関節 0.03m
const SKELETON = {head: 0.11, joint: 0.032, bone: 0.02, outline: 0.009};
const sphereGeo = new THREE.SphereGeometry(1, 20, 14);
const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 10);
cylGeo.translate(0, 0.5, 0);
const up = new THREE.Vector3(0, 1, 0);
const skeleton = (J) => {
  const g = new THREE.Group();
  const bones = [["head","neck"],["ls","rs"],["lh","rh"],["ls","lh"],["rs","rh"],["ls","le"],["le","lw"],["rs","re"],["re","rw"],["lh","lk"],["lk","la"],["la","lt"],["rh","rk"],["rk","ra"],["ra","rt"]];
  const V = Object.fromEntries(Object.entries(J).map(([k, v]) => [k, new THREE.Vector3(...v)]));
  V.neck = V.ls.clone().add(V.rs).multiplyScalar(0.5);
  for (const [mat, grow] of [[M.outline, SKELETON.outline], [M.white, 0]]) {
    for (const [k, p] of Object.entries(V)) {
      if (k === "neck") continue;
      const s = new THREE.Mesh(sphereGeo, mat);
      s.scale.setScalar((k === "head" ? SKELETON.head : SKELETON.joint) + grow);
      s.position.copy(p);
      s.castShadow = mat !== M.outline;
      g.add(s);
    }
    for (const [a, b] of bones) {
      const dir = V[b].clone().sub(V[a]);
      const c = new THREE.Mesh(cylGeo, mat);
      c.scale.set(SKELETON.bone + grow, dir.length(), SKELETON.bone + grow);
      c.position.copy(V[a]);
      c.quaternion.setFromUnitVectors(up, dir.normalize());
      c.castShadow = mat !== M.outline;
      g.add(c);
    }
  }
  return g;
};

// 卓上に立てる板 (ロゴのカード、ファイルのパネル)。正面は +z、下端が y=0。
// 机の高さに直に立てるとノート PC の画面に隠れるので、卓上イーゼルの受け棚で LIFT だけ持ち上げる
const STAND_LIFT = 0.12;
const standBoard = (w, h, tex) => {
  const g = new THREE.Group();
  const lean = 0.12;
  const inner = new THREE.Group();
  inner.position.y = STAND_LIFT;
  inner.rotation.x = -lean;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.005), M.white);
  body.position.y = h / 2;
  body.castShadow = true;
  inner.add(withEdges(body));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({map: tex}));
  face.position.set(0, h / 2, 0.0026);
  inner.add(face);
  g.add(inner);
  // イーゼル: 板を載せる受け棚と、前の 2 本脚、後ろの 1 本脚
  const ledge = box(Math.min(w, 0.2), 0.008, 0.025, M.grey, false);
  ledge.position.set(0, STAND_LIFT - 0.004, 0.012);
  g.add(ledge);
  const top = STAND_LIFT + h * 0.85;
  for (const sx of [-1, 1]) {
    const leg = box(0.012, top, 0.008, M.grey, false);

// 紙を山折りにした三角の卓上カード。表の面はゲームと同じく後ろへ 0.5 rad 傾ける。正面は +z、下端が y=0
const MEMO_TILT = 0.5;
const tentCard = (w, h, tex) => {
  const g = new THREE.Group();
  const rise = h * Math.cos(MEMO_TILT);
  const run = h * Math.sin(MEMO_TILT);
  const face = (map, sign) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      map ? new THREE.MeshLambertMaterial({map}) : M.white,
    );
    // 下端を軸に立て、頂点で表と裏が出会うように傾ける
    m.geometry.translate(0, h / 2, 0);
    m.rotation.x = -MEMO_TILT * sign;
    m.position.z = sign * run;
    if (sign < 0) m.rotation.y = Math.PI;
    m.castShadow = true;
    return withEdges(m);
  };
  g.add(face(tex, 1));
  g.add(face(null, -1));
  g.position.y = 0;
  g.userData.depth = run * 2;
  g.userData.rise = rise;
  return g;
};

  const spec = FILE_SPECS[kind];

  const h = spec.h + spec.outline * 2;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, 0.001, h), M.white);
  body.position.y = 0.0005;
  body.castShadow = true;
  g.add(body);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({map: fileTex(kind)}));
  face.rotation.x = -Math.PI / 2;
  face.position.y = 0.0011;
  g.add(face);
  return g;
};

// iPad を横向きにして、折りたたみのタブレットスタンドに立てる。正面は +z、下端が y=0
const tablet = (size, tex) => {
  const [w, h] = size;
  const g = new THREE.Group();
  const lift = 0.025;
  const lean = 0.28;
  const inner = new THREE.Group();
  inner.position.y = lift;
  inner.rotation.x = -lean;
  const body = box(w, h, 0.006, M.dark);
  body.position.y = h / 2;
  inner.add(body);
  // 画面は縁を 7 mm 残す
  const sw = w - 0.014;
  const sh = h - 0.014;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), new THREE.MeshBasicMaterial({map: tex}));
  screen.position.set(0, h / 2, 0.0032);
  inner.add(screen);
  g.add(inner);
  // スタンド: 受け台と、背中を支える板
  const ledge = box(w * 0.5, 0.012, 0.03, M.grey, false);
  ledge.position.set(0, lift - 0.006, 0.01);
  g.add(ledge);
  const backH = h * 0.75;
  const back = box(w * 0.4, backH, 0.006, M.grey, false);
  back.position.set(0, backH / 2, -0.06);
  back.rotation.x = 0.35;
  g.add(back);
  const base = box(w * 0.5, 0.006, 0.12, M.grey);
  base.position.set(0, 0.003, -0.03);
  g.add(base);
  return g;
};

// ---- 六角形の机 -----------------------------------------------------
// 台形の机 2 台を長い辺どうしでつないだ六角形。+z が通路側。
// 頂点は通路側の辺から時計回り。辺 i は頂点 i → i+1
const hexVerts = (L, S, D) => [
  [-S / 2, D / 2], [S / 2, D / 2], [L / 2, 0], [S / 2, -D / 2], [-S / 2, -D / 2], [-L / 2, 0],
];

const hexEdges = (verts) => verts.map((a, i) => {
  const b = verts[(i + 1) % verts.length];
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const t = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
  // 外向きの法線。中心から辺の中点へ向かう側
  let nrm = [t[1], -t[0]];
  if (nrm[0] * mid[0] + nrm[1] * mid[1] < 0) nrm = [-nrm[0], -nrm[1]];
  return {i, mid, len, t, n: nrm, rotY: Math.atan2(nrm[0], nrm[1])};
});

// 外形を外側へ m だけ広げる (辺ごとに平行移動した線の交点)
const inflate = (verts, m) => {
  const edges = hexEdges(verts);
  return verts.map((_, i) => {
    const e1 = edges[(i + verts.length - 1) % verts.length];
    const e2 = edges[i];
    const bis = [e1.n[0] + e2.n[0], e1.n[1] + e2.n[1]];
    const k = m / (bis[0] * e2.n[0] + bis[1] * e2.n[1]);
    return [verts[i][0] + bis[0] * k, verts[i][1] + bis[1] * k];
  });
};

// 外形 (x, z) を、高さ y0 から y1 までの柱にする
const prism = (verts, y0, y1, mat) => {
  const shape = new THREE.Shape(verts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const geo = new THREE.ExtrudeGeometry(shape, {depth: y1 - y0, bevelEnabled: false});
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, y0, 0);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return withEdges(m, 30);
};

// 中心から向き (dx, dz) に進んで、六角形の縁に当たるまでの距離
const rayToEdge = (edges, dx, dz) => {
  let best = Infinity;
  for (const e of edges) {
    const dn = e.n[0] * dx + e.n[1] * dz;
    if (dn <= 1e-6) continue;
    best = Math.min(best, (e.n[0] * e.mid[0] + e.n[1] * e.mid[1]) / dn);
  }
  return best;
};

// 円形のクロスを机の中心にかぶせた形。天板の上は平らに、縁から先は真下に垂れ、
// 床に届いた分は床に広がる。垂れた部分には、垂れるほど深くなるひだを付ける
const roundCloth = (edges, diameter) => {
  const R = diameter / 2;
  const NR = 56;
  const NT = 216;
  const pos = [];
  const hem = [];
  for (let i = 0; i <= NR; i++) {
    const r = (R * i) / NR;
    for (let j = 0; j <= NT; j++) {
      const th = (j / NT) * Math.PI * 2;
      const dx = Math.cos(th);
      const dz = Math.sin(th);
      const d = rayToEdge(edges, dx, dz);
      let h;
      let y;
      if (r <= d) {
        h = r;
        y = TOP + 0.004;
      } else {
        const s = r - d;
        const fold = (0.5 + 0.5 * Math.sin(th * 18)) * Math.min(s, 0.6) * 0.07;
        h = d + 0.006 + fold + s * 0.015;
        y = TOP - s;
        if (y < 0.004) {
          h += 0.004 - y;
          y = 0.004;
        }
      }
      pos.push(dx * h, y, dz * h);
      if (i === NR) hem.push(new THREE.Vector3(dx * h, y + 0.002, dz * h));
    }
  }
  const index = [];
  const row = NT + 1;
  for (let i = 0; i < NR; i++) {
    for (let j = 0; j < NT; j++) {
      const a = i * row + j;
      const b = a + row;
      index.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(index);
  geo.computeVertexNormals();
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color: "#ffffff", side: THREE.DoubleSide}));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(hem), M.edge));
  return g;
};

// 裾の高さ (床から)。負なら床に溜まる長さ
const hemRange = (edges, diameter) => {
  let lo = Infinity;
  let hi = -Infinity;
  for (let j = 0; j < 360; j++) {
    const th = (j / 360) * Math.PI * 2;
    const y = TOP - (diameter / 2 - rayToEdge(edges, Math.cos(th), Math.sin(th)));
    lo = Math.min(lo, y);
    hi = Math.max(hi, y);
  }
  return [lo, hi];
};

const hexTable = (verts, cloth) => {
  const g = new THREE.Group();
  // クロスを掛けたら天板は隠れる。縁の木目がのぞかないよう、脚だけ描く
  if (cloth) g.add(roundCloth(hexEdges(verts), state.clothD));
  else g.add(prism(verts, TOP - 0.03, TOP, M.wood));
  // 台形 2 台のつなぎ目
  if (!cloth) g.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(verts[5][0], TOP + 0.001, 0), new THREE.Vector3(verts[2][0], TOP + 0.001, 0)]),
    M.seam,
  ));
  // 脚は角の少し内側に、キャスター付き
  for (const [x, z] of inflate(verts, -0.08)) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, TOP - 0.1, 12), M.leg);
    leg.position.set(x, 0.07 + (TOP - 0.1) / 2, z);
    leg.castShadow = true;
    g.add(leg);
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 16), M.leg);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.035, z);
    g.add(wheel);
  }
  return g;
};

// 会場で借りるオフィスチェア。座面の前が -z
const chair = () => {
  const g = new THREE.Group();
  const seat = box(0.46, 0.07, 0.44, M.chair);
  seat.position.y = 0.45;
  g.add(seat);
  const back = box(0.44, 0.42, 0.04, M.chair);
  back.position.set(0, 0.72, 0.22);
  back.rotation.x = -0.1;
  g.add(back);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.36, 12), M.grey);
  pole.position.y = 0.24;
  g.add(pole);
  for (let i = 0; i < 5; i++) {
    const arm = box(0.3, 0.025, 0.04, M.chair, false);
    const a = (i / 5) * Math.PI * 2;
    arm.position.set(Math.cos(a) * 0.15, 0.06, Math.sin(a) * 0.15);
    arm.rotation.y = -a;
    g.add(arm);
    const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), M.chair);
    wheel.position.set(Math.cos(a) * 0.29, 0.025, Math.sin(a) * 0.29);
    g.add(wheel);
  }
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
};

// 辺に向かって座る 1 席。ローカル座標では机が -z 側、辺が z=0
const seat = (index, edge) => {
  const g = new THREE.Group();
  g.position.set(edge.mid[0], 0, edge.mid[1]);
  g.rotation.y = edge.rotY;
  const dropped = state.dropped[index];
  const {items} = state;
  const lap = laptop(dropped);
  lap.position.set(0, TOP, -0.17);
  g.add(lap);
  if (items.chairs) {
    const c = chair();
    c.position.set(0, 0, CHAIR_GAP);
    g.add(c);
  }
  if (items.people && !dropped) {
    if (items.chairs) {
      g.add(skeleton(seatedPose()));
    } else {
      const p = skeleton(standingPose(0.06));
      p.position.z = 0.3;
      g.add(p);
    }
  }
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(0.36, 0.045),
    new THREE.MeshBasicMaterial({map: textTex(`席 ${index + 1}`, {size: 72}), transparent: true, depthWrite: false}),
  );
  label.rotation.x = -Math.PI / 2;
  label.position.set(0, 0.004, CHAIR_GAP + 0.38);
  g.add(label);
  return g;
};

// 辺の位置と向きに合わせて物を置く。along は辺に沿ったずらし、inward は机の内側へのずらし
const onEdge = (obj, edge, {along = 0, inward = 0, y = 0} = {}) => {
  obj.position.set(
    edge.mid[0] + edge.t[0] * along - edge.n[0] * inward,
    y,
    edge.mid[1] + edge.t[1] * along - edge.n[1] * inward,
  );
  obj.rotation.y = edge.rotY;
  return obj;
};

// ---- 配置 ------------------------------------------------------------
let booth = new THREE.Group();
scene.add(booth);

const dispose = (obj) => {
  obj.traverse((o) => {
    if (o.geometry && o.geometry !== sphereGeo && o.geometry !== cylGeo) o.geometry.dispose();
    if (o.material && !Object.values(M).includes(o.material)) o.material.dispose();
  });
};

const MODE_NOTES = {
  "front-free": "通路側の辺を空け、ロゴと iPad を通路に向ける。3 人は残りの辺から中央を囲む。",
  "front-seat": "通路側の辺にも座る。通路から 1 人の画面が見える。ロゴと iPad は左手前の辺に寄せる。",
};

const build = () => {
  scene.remove(booth);
  dispose(booth);
  booth = new THREE.Group();
  scene.add(booth);

  const {hexSide: S, items} = state;
  const L = S * 2;            // 左右の角どうし
  const D = S * Math.sqrt(3); // 通路側の辺から奥の辺まで
  const verts = hexVerts(L, S, D);
  const edges = hexEdges(verts);
  booth.add(hexTable(verts, items.cloth));

  // 1 つおきの辺に座る。残りの 3 辺に、ロゴ・モニター・パネルを向ける
  const seatEdges = state.mode === "front-free" ? [5, 1, 3] : [0, 2, 4];
  const free = edges.filter((e) => !seatEdges.includes(e.i))
    .sort((a, b) => b.mid[1] - a.mid[1] || a.mid[0] - b.mid[0]);
  seatEdges.forEach((ei, k) => booth.add(seat(k, edges[ei])));

  // 通路にいちばん近い空きの辺: 観測モニターとロゴ
  const show = free[0];
  // 通路側の辺の天板に、iPad を 2 台並べて通路へ向ける
  const ipads = [["pro", -0.27], ["mini", 0.27]].filter(([k]) => state.ipads[k] !== "none");
  for (const [k, along] of ipads) {
    const t = tablet(SIZES[k], IPAD_TEX[state.ipads[k]]());
    booth.add(onEdge(t, show, {along: ipads.length === 1 ? 0 : along, inward: 0.12, y: TOP}));
  }
  // お題の三角紙: iPad の間に置き、お題の語のところにチーム名
  if (items.memo) {
    const [w, h] = SIZES.memo;
    booth.add(onEdge(tentCard(w, h, memoTex(state.team)), show, {inward: 0.14, y: TOP}));
  }
  if (items.logo) {
    const [w, h] = SIZES.logo;
    if (items.cloth) {
      // クロスの前面、天板のすぐ下に貼る
      const b = flatBoard(w, h, logoTex());
      booth.add(onEdge(b, show, {inward: -CLOTH_MARGIN, y: TOP - 0.05 - h / 2}));
    } else {
      // クロスがなければ、iPad の後ろに立てる
      booth.add(onEdge(standBoard(w, h, logoTex()), show, {inward: 0.3, y: TOP}));
    }
  }

  // 中央: ファイルを雑多に積んでおく
  if (items.files && state.fileSize === "a4") {
    // A4 のパネル 3 枚を、少しずつずらして回しながら重ねる
    const PILE = [
      // [種類, 中心からのずれ x, z, 回転]
      ["write", 0.06, -0.05, 0.55],
      ["image", -0.07, 0.04, -0.45],
      ["search", 0.02, 0.01, 0.14],
    ];
    PILE.forEach(([kind, dx, dz, turn], k) => {
      const [w, h] = SIZES[kind];
      const b = flatBoard(w, h, fileTex(kind));
      // 表を上に向けて寝かせ、通路側から読める向きにする
      b.rotation.set(-Math.PI / 2, 0, turn, "YXZ");
      b.rotation.y = free[0].rotY;
      b.position.set(dx, TOP + 0.003 + k * 0.0055, dz);
      booth.add(b);
    });
  }
  if (items.files && state.fileSize === "palm") {
    // ゲームと同じ大きさのカードを、山にして崩したように散らす (来場者に持ち帰ってもらう想定)
    const SCATTER = [
      ["write", 0.05, -0.04, 0.6], ["image", -0.06, 0.03, -0.5], ["search", 0.0, 0.0, 0.15],
      ["image", 0.08, 0.06, 1.1], ["write", -0.03, -0.07, -0.2], ["search", -0.09, -0.02, 0.9],
      ["search", 0.04, 0.09, -0.8], ["write", 0.1, -0.01, -1.2], ["image", -0.02, 0.05, 0.35],
    ];
    SCATTER.forEach(([kind, dx, dz, turn], k) => {
      const c = palmCard(kind);
      c.position.set(dx, TOP + 0.002 + k * 0.0012, dz);
      c.rotation.y = free[0].rotY + turn;
      booth.add(c);
    });
  }

  // 2 番目に通路に近い空きの辺: サーマルプリンタと、刷った伝票を挟んだメモ置き
  if (items.printer) {
    const e = free[1];
    booth.add(onEdge(thermalPrinter(), e, {along: -0.14, inward: 0.15, y: TOP}));
    booth.add(onEdge(memoStand(), e, {along: 0.06, inward: 0.12, y: TOP}));
    booth.add(onEdge(memoStand(), e, {along: 0.16, inward: 0.16, y: TOP}));
  }

  if (items.people) {
    // 机の奥で説明する人と、通路側から覗き込む来場者
    const back = free[free.length - 1];
    const staff = skeleton(standingPose(0.02));
    onEdge(staff, back, {inward: -0.55});
    staff.rotation.y = back.rotY;
    booth.add(staff);
    for (const [along, out, turn] of [[-1.15, 0.55, 0.7], [1.2, 0.7, -0.75]]) {
      const v = skeleton(standingPose(0.04));
      onEdge(v, show, {along, inward: -out});
      v.rotation.y = show.rotY + turn;
      booth.add(v);
    }
  }

  booth.traverse((o) => { if (o.isMesh && o.material !== M.outline && !o.material.transparent) o.receiveShadow = true; });

  // ---- 数字と注意
  const mm = (v) => Math.round(v * 1000).toLocaleString("ja-JP");
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  const extend = ([x, z]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); };
  verts.forEach(extend);
  for (const ei of seatEdges) {
    const e = edges[ei];
    extend([e.mid[0] + e.n[0] * SEAT_ROOM, e.mid[1] + e.n[1] * SEAT_ROOM]);
  }
  const rows = [
    ["1 辺", mm(S)],
    ["机の外形（角から角 × 辺から辺）", `${mm(L)} × ${mm(D)}`],
    ["椅子まで含めた広さ", `${mm(x1 - x0)} × ${mm(z1 - z0)}`],
  ];
  document.getElementById("stats").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  const msgs = [];
  const warn = document.getElementById("warn");
  warn.hidden = msgs.length === 0;
  warn.textContent = msgs.join(" ");
  document.getElementById("modeNote").textContent = MODE_NOTES[state.mode];
  const [lo, hi] = hemRange(edges, state.clothD);
  const cm = (v) => Math.round(v * 100);
  document.getElementById("clothNote").textContent = lo < 0
    ? `裾は床から最大 ${cm(hi)} cm 浮く（角）。辺の真ん中では床に ${cm(-lo)} cm 溜まる。`
    : `裾は床から ${cm(lo)}〜${cm(hi)} cm（辺の真ん中が低く、角が高い）。`;

  const list = [];
  if (items.logo) list.push([`ロゴのカード（${items.cloth ? "クロスに貼る" : "天板に立てる"}）`, "390 × 143"]);
  if (items.files && state.fileSize === "a4") {
    list.push(["Web Search のパネル（A4・積む）", "218 × 178"]);
    list.push(["画像生成のパネル（A4・積む）", "216 × 176"]);
    list.push(["Write のパネル（A4・積む）", "176 × 216"]);
  }
  if (items.files && state.fileSize === "palm") {
    list.push(["手のひらのファイル × 9（3 種）", "109 × 89 など"]);
  }
  if (items.printer) {
    list.push(["サーマルプリンタ（58 mm）", "110 × 120"]);
    list.push(["伝票のメモ置き × 2", "伝票 58 × 120"]);
  }
  if (items.memo) list.push([`お題の三角紙${state.team ? `（${state.team}）` : ""}`, "200 × 140"]);
  const SHOW_NAMES = {observer: "観測", slides: "資料", video: "デモ動画"};
  if (state.ipads.pro !== "none") list.push([`iPad Pro 11″（${SHOW_NAMES[state.ipads.pro]}）`, "250 × 178"]);
  if (state.ipads.mini !== "none") list.push([`iPad mini（${SHOW_NAMES[state.ipads.mini]}）`, "200 × 140"]);
  list.push(["MacBook 13″ × 3", "304 × 215"]);
  if (items.chairs) list.push(["椅子 × 3（会場で借りる）", ""]);
  document.getElementById("itemList").innerHTML = list.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("");
};

// ---- 視点 ------------------------------------------------------------
const VIEWS = {
  visitor: () => ({pos: [0.5, 1.65, (state.hexSide * Math.sqrt(3)) / 2 + 3.0], target: [0, 0.8, 0]}),
  table: () => ({pos: [0.15, 2.6, (state.hexSide * Math.sqrt(3)) / 2 + 1.1], target: [0, TOP, -0.05]}),
  overview: () => ({pos: [1.6 + state.hexSide * 1.2, 2.4 + state.hexSide * 0.8, 2.2 + state.hexSide * 1.2], target: [0, 0.6, 0]}),
  top: () => ({pos: [0, 2.8 + state.hexSide * 2.2, 0.01], target: [0, 0, 0]}),
};
let tween = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const goTo = (name, instant = false) => {
  const v = VIEWS[name]();
  const to = {pos: new THREE.Vector3(...v.pos), target: new THREE.Vector3(...v.target)};
  if (instant || reduceMotion) {
    camera.position.copy(to.pos); controls.target.copy(to.target); tween = null;
    return;
  }
  tween = {from: {pos: camera.position.clone(), target: controls.target.clone()}, to, t0: performance.now()};
};

// ---- 操作盤 ----------------------------------------------------------
const pressOne = (container, btn) => {
  for (const b of container.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b === btn));
};
document.getElementById("views").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  pressOne(e.currentTarget, b); goTo(b.dataset.view);
});
document.getElementById("modes").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  pressOne(e.currentTarget, b);
  state.mode = b.dataset.mode;
  build();
});
for (const seg of document.querySelectorAll("[data-ipad]")) {
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    pressOne(seg, b);
    state.ipads[seg.dataset.ipad] = b.dataset.show;
    build();
  });
}
document.getElementById("items").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", String(on));
  state.items[b.dataset.item] = on;
  build();
});
document.getElementById("drops").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const i = Number(b.dataset.seat);
  state.dropped[i] = !state.dropped[i];
  b.setAttribute("aria-pressed", String(state.dropped[i]));
  build();
});

const mmFmt = (v) => v.toLocaleString("ja-JP");
for (const id of ["hexSide", "clothD"]) {
  const input = document.getElementById(id);
  const out = document.getElementById(`${id}Out`);
  input.value = Math.round(state[id] * 1000);
  out.textContent = mmFmt(Number(input.value));
  input.addEventListener("input", () => {
    state[id] = Number(input.value) / 1000;
    out.textContent = mmFmt(Number(input.value));
    build();
  });
}

document.getElementById("fileSizes").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  pressOne(e.currentTarget, b);
  state.fileSize = b.dataset.size;
  build();
});

const memoTopic = document.getElementById("memoTopic");
memoTopic.addEventListener("input", () => {
  state.team = memoTopic.value.trim();
  for (const [k, t] of texCache) {
    if (k.startsWith("memo:") && k !== `memo:${state.team}`) { t.dispose(); texCache.delete(k); }
  }
  build();
});

const panel = document.getElementById("panel");
const togglePanel = document.getElementById("togglePanel");
togglePanel.addEventListener("click", () => {
  const collapsed = panel.classList.toggle("collapsed");
  togglePanel.textContent = collapsed ? "開く" : "閉じる";
  togglePanel.setAttribute("aria-expanded", String(!collapsed));
});

// ---- ループ ----------------------------------------------------------
const resize = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 58 : 42;
  // 広い画面では左に操作盤が浮くので、描画の中心を操作盤の右側の空きに寄せる
  const PANEL = 328;
  if (w > 720) camera.setViewOffset(w + PANEL, h, 0, 0, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
};
addEventListener("resize", resize);

const ease = (t) => 1 - Math.pow(1 - t, 3);
const tick = (now) => {
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / 700);
    const k = ease(t);
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, k);
    controls.target.lerpVectors(tween.from.target, tween.to.target, k);
    if (t >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
};

resize();
build();
goTo("visitor", true);
// 床の文字に使う和文フォントが届いたら、テクスチャを描き直す
document.fonts?.ready.then(() => {
  for (const [k, t] of texCache) if (k.startsWith("t:")) { t.dispose(); texCache.delete(k); }
  build();
});
requestAnimationFrame(tick);
</script>
</body>
</html>
